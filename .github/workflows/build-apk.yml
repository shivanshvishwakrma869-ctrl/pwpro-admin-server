name: Build PW Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PW Pro Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Mobile Expo Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps

      - name: Pre-bundle JavaScript for Release
        working-directory: ./mobile
        run: |
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ./pwprobyshivansh.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWProByShivansh-Release-APK
          path: ./pwprobyshivansh.apk
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 ./pwprobyshivansh.apk --clobber
