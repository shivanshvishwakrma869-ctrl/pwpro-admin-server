name: Build PW Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PW Pro APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Mobile Expo Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWProByShivansh-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 mobile/android/app/build/outputs/apk/debug/*.apk \
            --title "PW Pro by Shivansh APK v1.0.0" \
            --notes "### 📱 PW Pro by Shivansh - Android APK v1.0.0

          - **Direct CloudFront Video Stream**: High-speed, zero buffering
          - **Single-Use Key Activated**: Bound to device, managed via Admin Panel
          - **Neon DB & Vercel Admin Panel**: https://pwpro-admin-server.vercel.app/
          - **Features**: Offline Downloads, PDF Notes Viewer, Speed Controls (0.5x - 3.0x), Bookmarks, Dark/Light Mode

          Download **app-debug.apk** below and install on your Android device!" \
            --clobber
