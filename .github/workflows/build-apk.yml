name: Build PW Pro Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PW Pro APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWProByShivansh-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "PW Pro by Shivansh APK v1.0.0"
          body: |
            ### 📱 PW Pro by Shivansh — Android APK

            - **Single-Use Key Protected** (Synced with Neon PostgreSQL)
            - **Direct AWS CloudFront CDN Streaming** (Zero-Buffer HLS)
            - **Offline Downloads & Notes Viewer**
            - **Admin Panel**: https://pwpro-admin-server.vercel.app/

            Download `app-debug.apk` below and install directly on your Android phone!
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
