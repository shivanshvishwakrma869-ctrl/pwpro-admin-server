name: Build PW Pro Windows Desktop EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows Desktop Portable EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: |
          npm install

      - name: Build Windows Installer & Portable EXE
        working-directory: ./desktop
        run: |
          npm run build:installer
          npm run build:portable

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PW-Pro-Windows-Setup
          path: ./desktop/dist/PW-Pro-Setup-v1.5.0.exe
          retention-days: 30

      - name: Publish EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.5.0 ./desktop/dist/PW-Pro-Setup-v1.5.0.exe --clobber || true
          gh release upload v1.5.0 ./desktop/dist/PW-Pro-v1.5.0.exe --clobber || true
          gh release upload v1.0.0 ./desktop/dist/PW-Pro-Setup-v1.5.0.exe --clobber || true
